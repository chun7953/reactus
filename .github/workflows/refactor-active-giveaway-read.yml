name: Refactor active giveaway read

on:
  push:
    branches:
      - perf/reuse-active-giveaway-snapshot

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: perf/reuse-active-giveaway-snapshot

      - name: Refactor task monitor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/taskMonitor.js')
          text = path.read_text()

          old = """async function checkFinishedGiveaways(client) {
              const now = new Date();
              const activeGiveaways = await get.allActiveGiveaways();
              const finishedGiveaways = activeGiveaways.filter(g => new Date(g.end_time) <= now);
          """
          new = """async function checkFinishedGiveaways(client, activeGiveaways, now = new Date()) {
              const finishedGiveaways = activeGiveaways.filter(g => new Date(g.end_time) <= now);
          """
          assert old in text, 'checkFinishedGiveaways block changed unexpectedly'
          text = text.replace(old, new, 1)

          old = """async function validateActiveGiveaways(client) {
              const activeGiveaways = await get.allActiveGiveaways();
              if (activeGiveaways.length === 0) return;
          """
          new = """async function validateActiveGiveaways(client, activeGiveaways) {
              if (activeGiveaways.length === 0) return;
          """
          assert old in text, 'validateActiveGiveaways block changed unexpectedly'
          text = text.replace(old, new, 1)

          old = """async function runHighFrequencyTasks(client) {
              try {
                  await recoverInterruptedGiveaways();
                  await checkFinishedGiveaways(client);
                  await validateActiveGiveaways(client);
                  await checkScheduledGiveaways(client);
              } catch (error) { console.error('[TaskMonitor] 高頻度タスクループ中にエラー:', error); }
          }
          """
          new = """async function runHighFrequencyTasks(client) {
              try {
                  await recoverInterruptedGiveaways();
                  const now = new Date();
                  const activeGiveaways = await get.allActiveGiveaways();
                  await checkFinishedGiveaways(client, activeGiveaways, now);
                  const remainingGiveaways = activeGiveaways.filter(g => new Date(g.end_time) > now);
                  await validateActiveGiveaways(client, remainingGiveaways);
                  await checkScheduledGiveaways(client);
              } catch (error) { console.error('[TaskMonitor] 高頻度タスクループ中にエラー:', error); }
          }
          """
          assert old in text, 'runHighFrequencyTasks block changed unexpectedly'
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/taskMonitor.js
          git commit -m "Reuse active giveaway snapshot in high-frequency tasks"
          git push origin HEAD:perf/reuse-active-giveaway-snapshot
