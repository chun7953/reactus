name: PR101 Mobile E2E One Shot

on:
  push:
    branches:
      - refactor/core-edit-scope-feedback

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refactor/core-edit-scope-feedback
      - name: Use visible edit path on desktop and mobile
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/admin.spec.mjs')
          source = path.read_text()
          old = "  const recurringEvent = page.locator('[data-reactus-date=\"2026-09-24\"] .month-event')\n    .filter({ hasText: '24日の予定5' });\n  await recurringEvent.click();"
          new = "  const recurringCard = page.locator('#eventList .event-card')\n    .filter({ hasText: '24日の予定5' });\n  await recurringCard.getByRole('button', { name: '編集', exact: true }).click();"
          if old not in source:
              raise SystemExit('recurring edit locator anchor not found')
          path.write_text(source.replace(old, new, 1))
          PY
          rm .github/workflows/tmp-pr101-mobile-e2e.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/admin.spec.mjs .github/workflows/tmp-pr101-mobile-e2e.yml
          git commit -m "Use visible recurring edit path in E2E"
          git push origin HEAD:refactor/core-edit-scope-feedback
