name: Reactus One-Time Read-Only Live Acceptance
on:
  push:
    branches:
      - validation/fly-readonly-calendar-20261108
permissions:
  contents: read
jobs:
  inspect:
    name: Read-only Fly health and HTTP status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Check public readiness endpoint from GitHub runner
        run: |
          set -euo pipefail
          http_code=$(curl --silent --show-error --max-time 15 --output "$RUNNER_TEMP/reactus-ready-body" --write-out '%{http_code}' 'https://reactus.fly.dev/readyz') || {
            echo 'PUBLIC_READYZ http request failed'
            exit 2
          }
          echo "PUBLIC_READYZ status=$http_code"
          test "$http_code" = 200
      - name: Read current Fly app state
        run: |
          set -euo pipefail
          timeout 35s docker run --rm --env FLY_API_TOKEN flyio/flyctl:v0.5.5 status --app reactus
      - name: Read live Fly health checks
        run: |
          set -euo pipefail
          timeout 35s docker run --rm --env FLY_API_TOKEN flyio/flyctl:v0.5.5 checks list --app reactus
      - name: Read current Machine state and recent events
        run: |
          set -euo pipefail
          timeout 35s docker run --rm --env FLY_API_TOKEN flyio/flyctl:v0.5.5 machine status 4d89440b166e18 --app reactus
