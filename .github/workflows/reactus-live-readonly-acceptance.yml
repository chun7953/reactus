name: Reactus One-Time Health Recovery
on:
  push:
    branches:
      - validation/fly-readonly-calendar-20261108
permissions:
  contents: read
concurrency:
  group: reactus-one-time-health-recovery
  cancel-in-progress: false
jobs:
  restore:
    name: Health-guarded recovery without redeploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Check public readiness before any side effect
        id: ready
        run: |
          set -euo pipefail
          code=$(curl --silent --max-time 9 --output "$RUNNER_TEMP/ready-before" --write-out '%{http_code}' 'https://reactus.fly.dev/readyz') || code=000
          echo "READY_BEFORE status=$code"
          if [ "$code" = 200 ]; then
            echo "restart_required=false" >> "$GITHUB_OUTPUT"
          else
            echo "restart_required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Machine is in failing state
        id: checks
        if: steps.ready.outputs.restart_required == 'true'
        run: |
          set -euo pipefail
          docker run --rm --env FLY_API_TOKEN flyio/flyctl:v0.5.5 status --app reactus
          docker run --rm --env FLY_API_TOKEN flyio/flyctl:v0.5.5 checks list --app reactus

      - name: Gracefully restart unhealthy singleton once
        if: steps.ready.outputs.restart_required == 'true'
        run: |
          set -euo pipefail
          echo 'A failing public readiness check requires recovery; sending a graceful restart to the existing Machine.'
          timeout 125s docker run --rm --env FLY_API_TOKEN \
            flyio/flyctl:v0.5.5 machine restart 4d89440b166e18 --app reactus

      - name: Check public readiness after recovery
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            code=$(curl --silent --max-time 8 --output "$RUNNER_TEMP/ready-after" --write-out '%{http_code}' 'https://reactus.fly.dev/readyz') || code=000
            echo "READY_AFTER attempt=$attempt status=$code"
            if [ "$code" = 200 ]; then
              echo 'RESTORE_STATUS healthy'
              exit 0
            fi
            sleep 8
          done
          echo 'RESTORE_STATUS not_yet_healthy'
          exit 1
