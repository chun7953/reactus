name: Apply core edit owner

on:
  push:
    branches:
      - refactor/core-edit-scope-feedback
    paths:
      - .github/workflows/apply-core-edit-owner.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, '[apply-core-edit-owner]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refactor/core-edit-scope-feedback
      - name: Move edit behavior into core owner
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('public/admin.js')
          source = path.read_text()

          old = "  instance.textContent = 'この回だけ';\n  const series = document.createElement('option');\n  series.value = 'series';\n  series.textContent = '繰り返し全体';\n  scope.append(instance, series);"
          new = "  instance.textContent = 'この予定のみ';\n  const future = document.createElement('option');\n  future.value = 'future';\n  future.textContent = 'これ以降の予定';\n  const series = document.createElement('option');\n  series.value = 'series';\n  series.textContent = 'すべての予定';\n  scope.append(instance, future, series);"
          if source.count(old) != 1:
              raise SystemExit(f'edit scope option block count={source.count(old)}')
          source = source.replace(old, new, 1)

          old = "    hint.textContent = recurringInstance\n      ? 'この回だけでは繰り返し条件と画像は変更できません。全体を選ぶと変更できます。'\n      : '保存するまでGoogleカレンダーは変更されません。';"
          new = "    hint.textContent = recurringInstance\n      ? 'この回だけでは繰り返し条件と画像は変更できません。全体を選ぶと変更できます。'\n      : state.edit.scope === 'future'\n        ? '選んだ回より前はそのまま残し、この回以降を新しい定期予定として編集します。'\n        : '保存するまでGoogleカレンダーは変更されません。';"
          if source.count(old) != 1:
              raise SystemExit(f'edit hint block count={source.count(old)}')
          source = source.replace(old, new, 1)

          old = "    $('#editBannerTitle').textContent = scope === 'series' ? '繰り返し予定全体を編集中' : '予定を編集中';"
          new = "    $('#editBannerTitle').textContent = scope === 'series'\n      ? '繰り返し予定全体を編集中'\n      : scope === 'future'\n        ? 'これ以降の予定を編集中'\n        : '予定を編集中';"
          if source.count(old) != 1:
              raise SystemExit(f'edit title line count={source.count(old)}')
          source = source.replace(old, new, 1)

          old = "async function editEvent(event) {\n  state.edit = {\n    sourceEvent: event,\n    scope: 'instance',\n    detail: null,\n    originalHasImage: false,\n    imageMode: 'keep',\n  };\n  setEditorHeading(true);\n  editControls().classList.remove('hidden');\n  await reloadEditDetail('instance');\n}"
          new = "function beginEditFeedback(event) {\n  const banner = editControls();\n  banner.classList.remove('hidden');\n  const label = event?.summary || event?.title || '';\n  $('#editBannerTitle').textContent = label ? `「${label}」を編集中` : '予定を編集中';\n  $('#editBannerHint').textContent = '予定の内容を読み込んでいます…';\n  $('#scheduleForm').closest('.panel')?.scrollIntoView({ behavior: 'smooth', block: 'start' });\n}\n\nasync function editEvent(event) {\n  state.edit = {\n    sourceEvent: event,\n    scope: 'instance',\n    detail: null,\n    originalHasImage: false,\n    imageMode: 'keep',\n  };\n  setEditorHeading(true);\n  beginEditFeedback(event);\n  await reloadEditDetail('instance');\n}"
          if source.count(old) != 1:
              raise SystemExit(f'editEvent block count={source.count(old)}')
          source = source.replace(old, new, 1)

          path.write_text(source)
          PY
          node --check public/admin.js
          rm .github/workflows/apply-core-edit-owner.yml
      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make edit scope and feedback core-owned'
          git push origin HEAD:refactor/core-edit-scope-feedback
