name: PR101 Edit Owner One Shot

on:
  push:
    branches:
      - refactor/core-edit-scope-feedback

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refactor/core-edit-scope-feedback
      - name: Patch core edit ownership and E2E
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          admin_path = Path('public/admin.js')
          admin = admin_path.read_text()
          old_hint = "'この回だけでは繰り返し条件と画像は変更できません。全体を選ぶと変更できます。'"
          new_hint = "'この予定のみでは繰り返し条件と画像は変更できません。「これ以降」または「すべての予定」を選ぶと変更できます。'"
          if old_hint not in admin:
              raise SystemExit('admin hint anchor not found')
          admin_path.write_text(admin.replace(old_hint, new_hint, 1))

          fixture_path = Path('tests/e2e/admin-fixture-server.mjs')
          fixture = fixture_path.read_text()
          helper_anchor = "function apiResponse(req, res, url) {"
          helper = dedent("""\
          function editDetailFor(url) {
            const eventId = url.searchParams.get('eventId');
            const source = events.find(event => event.id === eventId) || events[0];
            const recurring = Boolean(source.recurringEventId);
            return {
              calendarId: source.calendarId,
              requestedEventId: source.id,
              monitorId: source.monitorId,
              type: source.type,
              startTime: String(source.start || '').slice(0, 16),
              endTime: String(source.end || '').slice(0, 16),
              title: source.summary || '',
              body: source.description || '',
              durationMinutes: 30,
              message: source.description || '',
              prizes: source.type === 'giveaway' ? [{ name: 'テスト景品', winners: 2 }] : [],
              mention: { mode: 'none' },
              recurrence: recurring
                ? { unit: 'week', interval: 1, weekdays: ['TH'] }
                : { unit: 'once', interval: 1 },
              originalWasRecurring: recurring,
              hasImage: Boolean(source.hasImage),
            };
          }

          function apiResponse(req, res, url) {""")
          if helper_anchor not in fixture:
              raise SystemExit('fixture helper anchor not found')
          fixture = fixture.replace(helper_anchor, helper, 1)
          old_event = "if (url.pathname === '/api/admin/event') return json(res, { event: events[0] });"
          new_event = "if (url.pathname === '/api/admin/event') return json(res, { event: editDetailFor(url) });"
          if old_event not in fixture:
              raise SystemExit('fixture event anchor not found')
          fixture_path.write_text(fixture.replace(old_event, new_event, 1))

          spec_path = Path('tests/e2e/admin.spec.mjs')
          spec = spec_path.read_text()
          marker = "test('core editor owns recurring future scope and immediate loading feedback'"
          if marker not in spec:
              spec += dedent(r'''\

          test('core editor owns recurring future scope and immediate loading feedback', async ({ page }) => {
            const failures = await openAdmin(page);
            let releaseInitialDetail;
            const initialDetailGate = new Promise(resolve => { releaseInitialDetail = resolve; });
            await page.route('**/api/admin/event?*', async route => {
              const scope = new URL(route.request().url()).searchParams.get('scope');
              if (scope === 'instance') await initialDetailGate;
              await route.continue();
            });

            const recurringEvent = page.locator('[data-reactus-date="2026-09-24"] .month-event')
              .filter({ hasText: '24日の予定5' });
            await recurringEvent.click();

            await expect(page.locator('#editBanner')).toBeVisible();
            await expect(page.locator('#editBannerTitle')).toHaveText('「24日の予定5」を編集中');
            await expect(page.locator('#editBannerHint')).toHaveText('予定の内容を読み込んでいます…');

            releaseInitialDetail();
            await expect(page.locator('#editScopeWrap')).toBeVisible();
            await expect(page.locator('#editScope option')).toHaveCount(3);
            await expect(page.locator('#editScope option').nth(0)).toHaveText('この予定のみ');
            await expect(page.locator('#editScope option').nth(1)).toHaveText('これ以降の予定');
            await expect(page.locator('#editScope option').nth(2)).toHaveText('すべての予定');

            const futureRequest = page.waitForRequest(request => {
              const url = new URL(request.url());
              return url.pathname === '/api/admin/event' && url.searchParams.get('scope') === 'future';
            });
            await page.locator('#editScope').selectOption('future');
            await futureRequest;
            await expect(page.locator('#editBannerTitle')).toHaveText('これ以降の予定を編集中');
            await expect(page.locator('#editBannerHint')).toHaveText(
              '選んだ回より前はそのまま残し、この回以降を新しい定期予定として編集します。',
            );
            await expect(page.locator('#repeatUnit')).toBeEnabled();
            await expect(page.locator('#image')).toBeEnabled();

            await assertEventLoopResponsive(page);
            expect(failures).toEqual([]);
          });
          ''')
          spec_path.write_text(spec)
          PY
          rm .github/workflows/tmp-pr101-edit-owner.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/admin.js tests/e2e/admin-fixture-server.mjs tests/e2e/admin.spec.mjs .github/workflows/tmp-pr101-edit-owner.yml
          git commit -m "Test core-owned recurring edit flow"
          git push origin HEAD:refactor/core-edit-scope-feedback
