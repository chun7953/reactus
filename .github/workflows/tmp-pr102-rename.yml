name: PR102 Rename Enhancement Aggregator

on:
  push:
    branches:
      - refactor/rename-enhancement-aggregator

permissions:
  contents: write

jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refactor/rename-enhancement-aggregator
      - name: Rename obsolete future-scope aggregator
        shell: bash
        run: |
          git mv public/common/admin-future-scope.js public/common/admin-enhancement-modules.js
          python - <<'PY'
          from pathlib import Path
          roots = [Path('public'), Path('tests')]
          for root in roots:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in {'.js', '.mjs', '.html'}:
                      continue
                  source = path.read_text()
                  updated = source.replace('admin-future-scope.js', 'admin-enhancement-modules.js')
                  if updated != source:
                      path.write_text(updated)
          PY
          rm .github/workflows/tmp-pr102-rename.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Rename enhancement module aggregator"
          git push origin HEAD:refactor/rename-enhancement-aggregator
