name: PR101 Cleanup One Shot

on:
  push:
    branches:
      - refactor/core-edit-scope-feedback

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refactor/core-edit-scope-feedback
      - name: Remove stale helper test and fix E2E separator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/admin.spec.mjs')
          source = path.read_text()
          old = "});\\\n\ntest('core editor owns recurring future scope and immediate loading feedback'"
          new = "});\n\ntest('core editor owns recurring future scope and immediate loading feedback'"
          if old not in source:
              raise SystemExit('E2E separator anchor not found')
          path.write_text(source.replace(old, new, 1))
          PY
          rm tests/adminEditFeedback.test.mjs
          rm .github/workflows/tmp-pr101-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/admin.spec.mjs tests/adminEditFeedback.test.mjs .github/workflows/tmp-pr101-cleanup.yml
          git commit -m "Remove retired edit feedback test"
          git push origin HEAD:refactor/core-edit-scope-feedback
