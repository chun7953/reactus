name: Apply monitor owner refactor

on:
  push:
    branches:
      - refactor/schedule-monitor-owner-permissions

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-monitor-owner]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refactor/schedule-monitor-owner-permissions
          fetch-depth: 0
      - name: Apply owner refactor
        run: node scripts/apply-monitor-owner-refactor.mjs
      - name: Validate syntax
        run: node --check public/admin.js
      - name: Remove retired and one-shot files
        run: |
          git rm -f public/common/admin-post-destinations.js
          git rm -f scripts/apply-monitor-owner-refactor.mjs
          git rm -f .github/workflows/apply-monitor-owner-refactor.yml
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/admin.js public/common/admin-future-scope.js tests/adminDashboardPolish.test.mjs tests/adminCalendarServerCache.test.mjs tests/adminPostDestinationsLazy.test.mjs tests/e2e/admin-schedule-monitor-owner.spec.mjs
          git commit -m "Make schedule destinations core-owned"
          git push origin HEAD:refactor/schedule-monitor-owner-permissions
