name: Scope calendar asset callers

on:
  push:
    branches:
      - security/scope-calendar-assets-by-guild

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: security/scope-calendar-assets-by-guild

      - name: Add guild scope to asset callers
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=None):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if expected is not None:
                  assert count == expected, f'{path}: expected {expected} occurrences of {old!r}, got {count}'
              else:
                  assert count > 0, f'{path}: missing {old!r}'
              p.write_text(text.replace(old, new))

          replace('src/lib/taskMonitor.js', 'async function eventImageFile(properties) {', 'async function eventImageFile(properties, guildId) {', 1)
          replace('src/lib/taskMonitor.js', 'getCalendarPostImage(assetId)', 'getCalendarPostImage(assetId, guildId)', 1)
          replace('src/lib/taskMonitor.js', 'eventImageFile(privateProperties)', 'eventImageFile(privateProperties, monitor.guild_id)', 2)

          replace('src/lib/webCalendarAdmin.js', 'deleteCalendarPostImage(assetId)', 'deleteCalendarPostImage(assetId, guildId)')
          replace('src/lib/webCalendarDuplicateService.js', 'deleteCalendarPostImage(clonedAssetId)', 'deleteCalendarPostImage(clonedAssetId, guildId)', 1)
          replace('src/lib/webCalendarEditService.js', 'deleteCalendarPostImage(newAssetId)', 'deleteCalendarPostImage(newAssetId, guildId)')
          replace('src/lib/webCalendarEditService.js', 'deleteCalendarPostImage(oldAssetId)', 'deleteCalendarPostImage(oldAssetId, guildId)', 1)
          replace('src/commands/calendar/calendarpost.js', 'deleteCalendarPostImage(assetId)', 'deleteCalendarPostImage(assetId, interaction.guildId)')
          replace('src/commands/calendar/calendaredit.js', 'deleteCalendarPostImage(image.oldAssetId)', 'deleteCalendarPostImage(image.oldAssetId, interaction.guildId)', 2)
          replace('src/commands/calendar/calendaredit.js', 'deleteCalendarPostImage(createdAssetId)', 'deleteCalendarPostImage(createdAssetId, interaction.guildId)', 1)
          PY

      - name: Commit caller updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib src/commands/calendar
          git commit -m "Pass guild scope to calendar image operations"
          git push origin HEAD:security/scope-calendar-assets-by-guild
