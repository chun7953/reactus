name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Temporary diagnostics on this PR: generate a lockfile candidate using
      # npm's resolver on the CI runner, without changing the repository.
      - name: Export npm audit remediation candidate
        run: |
          npm audit fix --package-lock-only --omit=dev || true
          echo '__REACTUS_LOCKFILE_START__'
          base64 -w 400 package-lock.json
          echo
          echo '__REACTUS_LOCKFILE_END__'
      - name: Run checks
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build production image
        run: docker build --tag reactus-ci .
