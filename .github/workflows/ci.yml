name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REACTUS_TEST_DATABASE_URL: postgresql://reactus:reactus@localhost:5432/reactus_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: reactus
          POSTGRES_PASSWORD: reactus
          POSTGRES_DB: reactus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reactus -d reactus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build production image
        run: docker build --tag reactus-ci .

      - name: Verify pinned Fly CLI image
        run: docker run --rm flyio/flyctl:v0.5.5 version
